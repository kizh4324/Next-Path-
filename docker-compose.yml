services:
  db:
    image: postgres:16-alpine
    container_name: nextpath-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nextpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextpath}
      POSTGRES_DB: ${POSTGRES_DB:-nextpath}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextpath} -d ${POSTGRES_DB:-nextpath}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Repo root, so data/seed/ can be baked into the image.
      context: .
      dockerfile: backend/Dockerfile
    container_name: nextpath-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nextpath}:${POSTGRES_PASSWORD:-nextpath}@db:5432/${POSTGRES_DB:-nextpath}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SEED_ROOT: /app/data/seed
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Overlays the copy baked into the image so edits are picked up without a rebuild.
      - ./data/seed:/app/data/seed:ro
      # Raw vendor sources, needed only by the build_*_seed.py authoring scripts.
      - ./Dataset:/Dataset:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: nextpath-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pgdata:
