name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy, strict)
        run: mypy app data

      # Runs against in-memory SQLite; PostgreSQL remains the production target.
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  seed-integrity:
    name: Seed catalogue matches its sources
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Fails if a built catalogue was hand-edited or its source changed without a
      # rebuild — the seed files are generated artefacts and must stay reproducible.
      - name: Verify built seed files are current
        run: |
          python -m data.build_career_seed --check
          python -m data.build_market_seed --check
          python -m data.build_scholarship_seed --check

  migrations:
    name: Migrations apply to a clean PostgreSQL 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nextpath
          POSTGRES_PASSWORD: nextpath
          POSTGRES_DB: nextpath
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nextpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://nextpath:nextpath@localhost:5432/nextpath
        run: alembic upgrade head

      - name: Seed the catalogue and verify counts
        env:
          DATABASE_URL: postgresql+asyncpg://nextpath:nextpath@localhost:5432/nextpath
        run: |
          python -m data.seed_runner
          python -m data.seed_runner            # idempotency: a second run must converge
          python -m data.seed_runner --verify

      - name: alembic downgrade base
        env:
          DATABASE_URL: postgresql+asyncpg://nextpath:nextpath@localhost:5432/nextpath
        run: alembic downgrade base

  frontend:
    name: Frontend — types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
