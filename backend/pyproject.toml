[project]
name = "nextpath-backend"
version = "0.1.0"
description = "Next_Path — AI-Based Career Decision & Pathway Companion (FastAPI backend)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "venv", "app/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Long lines are caught by the formatter; flagging them twice is noise.
    "E501",
    # FastAPI's Depends()/Query() defaults are function calls by design.
    "B008",
    # Student-facing copy deliberately uses ₹, en dashes, and typographic quotes.
    # These are correct Indian-English typography, not homoglyph mistakes.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["RUF012"]   # SQLAlchemy declarative attrs are not ClassVar
"tests/*.py" = ["S101"]           # asserts are the point of a test

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["app/alembic/versions/.*"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type stubs.
module = ["jose.*", "passlib.*", "apscheduler.*", "google.*", "google.genai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*", "app/main.py"]
